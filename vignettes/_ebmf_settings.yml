# Canonical EBMF analysis and program-validation settings.
#
# Every investigation vignette resolves its shared settings from this file via
# resolve_ebmf_settings(), so the simulation, null-simulation, univariate and
# multi-trait studies cannot drift apart. A vignette parameter supplied at
# render time (e.g. by the scripts/run_investigation_*_grid.sh grids) overrides
# the value here; anything not supplied falls back to it.
#
# Entries marked REVISED BY HPC are provisional: the recalibrated simulation
# and null studies are expected to replace them once those runs complete.

# --- EBMF fit -------------------------------------------------------------
ebmf_prior: point_laplace
ebmf_backfit: true
ebmf_lfsr_threshold: 0.02
ebmf_magnitude_threshold: 0.5
ebmf_greedy_Kmax: 100

# --- Pleiotropy matrix ----------------------------------------------------
trait_subset: phenotypic
min_snp_signals: 2
compress_method: asinh
compress_scale: 5
# Must match between the univariate and multi-trait studies or they factorise
# different matrices and their programs are not comparable.
include_trans: true

# --- Program validation ---------------------------------------------------
# Interpretability floor, not a discriminating gate: a 2-SNP program cannot be
# annotated. Pass rates for this check are ~100% in every study.
min_module_size: 3
# Edge threshold for the connectedness statistic.
similarity_threshold: 0.2
# Size-matched similarity test: member SNPs vs random same-size SNP sets from
# the same trait. 10000 so the BH q can fall below high_similarity_q when only a
# few programs sit at the permutation floor.
similarity_n_perm: 10000
# Confidence tiers. medium: similarity_q < similarity_q; high: also
# similarity_q < high_similarity_q and connectedness >= high_connectedness.
# REVISED BY HPC.
similarity_q: 0.05
high_similarity_q: 0.01
high_connectedness: 0.4
# Programs that pass the similarity test but whose trait loadings rest on
# fewer than this effective number of traits are tiered single_trait (needs a
# closer look, not yet a program). A program that fails the similarity test is
# low whatever its traits. Almost every program in the null simulations falls
# below this.
min_effective_traits: 1.5
